# Aplicado via kubectl pelo null_resource.postgres (main.tf) - as credenciais (usuário/
# senha/banco) não vão aqui, são criadas à parte como Secret "postgres-credentials"
# (ver main.tf), referenciado abaixo via envFrom.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: oficina
spec:
  # explícito de propósito - a StorageClass "gp2" que o EKS cria automaticamente não
  # vem marcada como default (sem a anotação "storageclass.kubernetes.io/is-default-
  # class"), então um PVC sem "storageClassName" fica pendurado para sempre com "no
  # persistent volumes available for this claim and no storage class is set".
  storageClassName: gp2
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: oficina
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          readinessProbe:
            exec:
              # $(POSTGRES_USER) é substituído pelo próprio Kubernetes a partir do
              # envFrom acima - não é interpolação de shell nem do Terraform.
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  # nome "postgres" - é o host que o Secret/Deployment da API (/k8s) usa em DATABASE_URL.
  name: postgres
  namespace: oficina
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
