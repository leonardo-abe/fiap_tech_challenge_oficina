name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --frozen --no-build
      # chama o binário do venv direto em vez de "uv run" - "uv run" pode disparar um
      # sync implícito se detectar qualquer divergência com o lockfile, o que não faz
      # sentido logo depois de um "uv sync --frozen" explícito.
      - run: .venv/bin/ruff check app tests

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oficina_test
          POSTGRES_PASSWORD: oficina_test
          POSTGRES_DB: oficina_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U oficina_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # TEST_DATABASE_URL é o que tests/integration/conftest.py usa de fato para falar
      # com o Postgres de serviço acima. DATABASE_URL não é usado por nenhum teste (a
      # suíte sobrescreve get_session com a engine de TEST_DATABASE_URL), mas precisa
      # existir com um valor qualquer porque app.shared.settings.Settings exige todo
      # campo preenchido já na importação do app (ver app/main.py).
      TEST_DATABASE_URL: postgresql+asyncpg://oficina_test:oficina_test@localhost:5433/oficina_test
      DATABASE_URL: postgresql+asyncpg://oficina_test:oficina_test@localhost:5433/oficina_test
      APP_NAME: "Oficina Mecânica API"
      ENVIRONMENT: test
      JWT_SECRET_KEY: ci-apenas-para-testes-nao-usar-em-producao-32b
      JWT_EXPIRACAO_MINUTOS: "60"
      SEED_ADMIN_EMAIL: admin@oficina.com.br
      SEED_ADMIN_SENHA: admin123
      SEED_ATENDENTE_EMAIL: atendente@oficina.com.br
      SEED_ATENDENTE_SENHA: atendente123
      SEED_MECANICO_EMAIL: mecanico@oficina.com.br
      SEED_MECANICO_SENHA: mecanico123
      NOTIFICACAO_BACKEND: log
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --frozen --no-build
      - run: .venv/bin/pytest --cov=app --cov-report=term-missing --cov-fail-under=90

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # VALIDAÇÃO automatizada, não deploy contínuo de verdade: sobe um cluster kind
  # efêmero dentro do próprio runner hospedado (via o mesmo Terraform de /infra,
  # exercitando-o de verdade) só para provar que a imagem recém-publicada sobe de
  # ponta a ponta no Kubernetes - banco, migration, Deployment e /health. O cluster
  # inteiro é descartado com o runner ao fim do job; nada fica no ar, porque um runner
  # hospedado do GitHub não tem como ficar acessível depois que o job termina. Quem
  # efetivamente atualiza um ambiente persistente e alcançável é o job "deploy-local"
  # logo abaixo.
  deploy-e2e:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.6"

      - name: Instalar kind e kubectl
        run: |
          # baixa no diretório de trabalho (sempre gravável) e só usa sudo para mover/
          # marcar executável em /usr/local/bin - o runner hospedado não deixa escrever
          # lá diretamente com o usuário sem privilégio. --proto '=https' impede que um
          # redirecionamento leve o curl para uma URL não-https sem erro.
          curl --proto '=https' --tlsv1.2 -Lo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          sudo install -m 0755 kind /usr/local/bin/kind
          kubectl_version="$(curl --proto '=https' --tlsv1.2 -Ls https://dl.k8s.io/release/stable.txt)"
          curl --proto '=https' --tlsv1.2 -Lo kubectl "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl

      - name: Provisionar cluster kind + Postgres (Terraform)
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve -var="postgres_password=${{ github.run_id }}"
          echo "KUBECONFIG=$PWD/kubeconfig" >> "$GITHUB_ENV"

      - name: Carregar imagem no cluster
        run: |
          docker pull ${{ env.IMAGE }}:${{ github.sha }}
          kind load docker-image ${{ env.IMAGE }}:${{ github.sha }} --name oficina

      - name: Aplicar manifestos da aplicação
        run: |
          DB_URL="$(terraform -chdir=infra output -raw postgres_connection_string)"
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl create secret generic oficina-secrets -n oficina \
            --from-literal=DATABASE_URL="$DB_URL" \
            --from-literal=JWT_SECRET_KEY="ci-ephemeral-jwt-secret-de-32-bytes-ou-mais" \
            --from-literal=SEED_ADMIN_SENHA="admin123" \
            --from-literal=SEED_ATENDENTE_SENHA="atendente123" \
            --from-literal=SEED_MECANICO_SENHA="mecanico123"

          sed "s|:local|:${{ github.sha }}|" k8s/migrate-job.yaml | kubectl apply -f -
          kubectl wait --for=condition=complete job/oficina-migrate -n oficina --timeout=120s

          sed "s|:local|:${{ github.sha }}|" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl rollout status deployment/oficina-api -n oficina --timeout=120s

      - name: Smoke test (/health)
        run: |
          kubectl port-forward svc/oficina-api 8000:8000 -n oficina &
          sleep 5
          curl -sf http://localhost:8000/health

      - name: Destruir cluster
        if: always()
        working-directory: infra
        run: terraform destroy -auto-approve -var="postgres_password=${{ github.run_id }}"

  # Continuous DEPLOYMENT de verdade: atualiza o cluster kind PERSISTENTE que já está
  # de pé na máquina onde esse runner self-hosted roda (criado uma vez, manualmente,
  # via "terraform apply" - ver infra/README.md). Diferente do deploy-e2e acima, esse
  # ambiente continua no ar depois do job terminar - é nele que a demonstração/vídeo
  # roda, e é esse job que efetivamente conecta "push na main" a "app atualizado no
  # cluster que você está olhando".
  #
  # Pré-requisitos na máquina que hospeda o runner (ver k8s/README.md):
  #   - cluster kind "oficina" já criado e com kubeconfig mesclado ao padrão
  #     (`kind export kubeconfig --name oficina`), para o `kubectl` funcionar sem
  #     configuração extra nos passos abaixo;
  #   - runner self-hosted do GitHub Actions instalado e rodando (Settings > Actions >
  #     Runners > New self-hosted runner).
  #
  # Segurança: um runner self-hosted em repositório PÚBLICO é perigoso se qualquer
  # pull_request puder disparar jobs nele (um PR malicioso rodaria código arbitrário na
  # sua máquina). Por isso este job só roda em push direto na main - só quem tem
  # permissão de escrita no repositório consegue disparar (ou alterar) este job; ele
  # nunca roda em pull_request, nem mesmo de PRs do próprio repositório.
  deploy-local:
    runs-on: self-hosted
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Carregar imagem no cluster local
        run: |
          docker pull ${{ env.IMAGE }}:${{ github.sha }}
          kind load docker-image ${{ env.IMAGE }}:${{ github.sha }} --name oficina

      - name: Atualizar deploy
        run: |
          # o Job de migration é imutável depois de criado - sem apagar o anterior, o
          # "kubectl apply" falharia tentando mudar um campo que o Kubernetes não deixa
          # alterar num Job já existente.
          kubectl delete job oficina-migrate -n oficina --ignore-not-found
          sed "s|:local|:${{ github.sha }}|" k8s/migrate-job.yaml | kubectl apply -f -
          kubectl wait --for=condition=complete job/oficina-migrate -n oficina --timeout=120s

          sed "s|:local|:${{ github.sha }}|" k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/oficina-api -n oficina --timeout=120s

      - name: Smoke test (/health)
        run: |
          kubectl port-forward svc/oficina-api 8000:8000 -n oficina &
          PF_PID=$!
          sleep 5
          curl -sf http://localhost:8000/health
          kill $PF_PID
