name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --frozen --no-build
      # chama o binário do venv direto em vez de "uv run" - "uv run" pode disparar um
      # sync implícito se detectar qualquer divergência com o lockfile, o que não faz
      # sentido logo depois de um "uv sync --frozen" explícito.
      - run: .venv/bin/ruff check app tests

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oficina_test
          POSTGRES_PASSWORD: oficina_test
          POSTGRES_DB: oficina_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U oficina_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # TEST_DATABASE_URL é o que tests/integration/conftest.py usa de fato para falar
      # com o Postgres de serviço acima. DATABASE_URL não é usado por nenhum teste (a
      # suíte sobrescreve get_session com a engine de TEST_DATABASE_URL), mas precisa
      # existir com um valor qualquer porque app.shared.settings.Settings exige todo
      # campo preenchido já na importação do app (ver app/main.py).
      TEST_DATABASE_URL: postgresql+asyncpg://oficina_test:oficina_test@localhost:5433/oficina_test
      DATABASE_URL: postgresql+asyncpg://oficina_test:oficina_test@localhost:5433/oficina_test
      APP_NAME: "Oficina Mecânica API"
      ENVIRONMENT: test
      JWT_SECRET_KEY: ci-apenas-para-testes-nao-usar-em-producao-32b
      JWT_EXPIRACAO_MINUTOS: "60"
      SEED_ADMIN_EMAIL: admin@oficina.com.br
      SEED_ADMIN_SENHA: admin123
      SEED_ATENDENTE_EMAIL: atendente@oficina.com.br
      SEED_ATENDENTE_SENHA: atendente123
      SEED_MECANICO_EMAIL: mecanico@oficina.com.br
      SEED_MECANICO_SENHA: mecanico123
      NOTIFICACAO_BACKEND: log
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --frozen --no-build
      - run: .venv/bin/pytest --cov=app --cov-report=term-missing --cov-fail-under=90

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Continuous DEPLOYMENT de verdade: autentica na AWS (AWS Academy Learner Lab) e
  # atualiza o cluster EKS PERSISTENTE compartilhado por toda a equipe/avaliação - não é
  # um cluster descartável por job, nem depende de nenhuma máquina/runner específico.
  # Isso só é possível porque o alvo agora é uma API alcançável pela internet (Service
  # "LoadBalancer" - ver k8s/service.yaml), diferente de uma versão anterior deste
  # projeto que usava um cluster "kind" só acessível localmente (e por isso precisava de
  # um runner self-hosted para ter CD de verdade).
  #
  # Pré-requisito: os secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY /
  # AWS_SESSION_TOKEN do repositório devem estar com as credenciais ATUAIS da sessão do
  # AWS Academy (ela expira em poucas horas - ver infra/README.md). Sem isso, este job
  # falha na autenticação - esperado, é o trade-off de usar um laboratório temporário em
  # vez de uma conta AWS permanente.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.6"

      - name: Provisionar/atualizar cluster EKS + Postgres (Terraform)
        working-directory: infra
        env:
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
          # formato HCL de lista - "[\"a\",\"b\"]" via env var TF_VAR funciona direto.
          TF_VAR_subnet_ids: ${{ secrets.AWS_SUBNET_IDS }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=us-east-1"
          # idempotente: na primeira execução cria cluster+node group+Postgres (~15-20
          # min); nas seguintes, só confirma que nada mudou (rápido).
          terraform apply -auto-approve
          echo "KUBECONFIG=$PWD/kubeconfig" >> "$GITHUB_ENV"

      - name: Aplicar manifestos da aplicação
        run: |
          DB_URL="$(terraform -chdir=infra output -raw postgres_connection_string)"
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl create secret generic oficina-secrets -n oficina \
            --from-literal=DATABASE_URL="$DB_URL" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=SEED_ADMIN_SENHA="${{ secrets.SEED_ADMIN_SENHA }}" \
            --from-literal=SEED_ATENDENTE_SENHA="${{ secrets.SEED_ATENDENTE_SENHA }}" \
            --from-literal=SEED_MECANICO_SENHA="${{ secrets.SEED_MECANICO_SENHA }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # o Job de migration é imutável depois de criado - sem apagar o anterior, o
          # "kubectl apply" falharia tentando mudar um campo que o Kubernetes não deixa
          # alterar num Job já existente.
          kubectl delete job oficina-migrate -n oficina --ignore-not-found
          sed "s|:local|:${{ github.sha }}|" k8s/migrate-job.yaml | kubectl apply -f -
          kubectl wait --for=condition=complete job/oficina-migrate -n oficina --timeout=120s

          sed "s|:local|:${{ github.sha }}|" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl rollout status deployment/oficina-api -n oficina --timeout=180s

      - name: Smoke test (/health)
        run: |
          kubectl port-forward svc/oficina-api 8000:8000 -n oficina &
          PF_PID=$!
          sleep 5
          curl -sf http://localhost:8000/health
          kill $PF_PID
