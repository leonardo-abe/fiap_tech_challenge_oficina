apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      # a API não fala com a API do Kubernetes - não precisa do token de service
      # account que o Kubernetes automonta por padrão.
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ghcr.io/leonardo-abe/fiap_tech_challenge_oficina:latest
          # IfNotPresent (não o default "Always" que a tag "latest" implicaria) - permite
          # usar uma imagem carregada localmente via "kind load docker-image" sem
          # depender do registry estar acessível (útil em dev local/smoke test de CI).
          imagePullPolicy: IfNotPresent
          # sobrescreve o CMD do Dockerfile (que roda "alembic upgrade head" antes de
          # subir) - a migration já rodou no Job oficina-migrate; rodá-la de novo aqui,
          # em paralelo em cada réplica/scale-up do HPA, seria uma corrida.
          command: ["uv", "run", "fastapi", "run", "app/main.py", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
