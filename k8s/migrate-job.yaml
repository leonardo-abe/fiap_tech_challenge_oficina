# Roda "alembic upgrade head" e o seed de usuários de teste (scripts/seed_usuarios.py)
# uma única vez antes do Deployment da API subir. O Dockerfile roda só a migration no
# próprio CMD do container, o que é seguro com uma única réplica mas vira corrida
# (múltiplos "alembic upgrade head" concorrentes) com o HPA escalando a API para várias
# réplicas - por isso a migration é isolada aqui, e o Deployment (deployment.yaml)
# sobrescreve o command do container para pular a migration. O seed é idempotente (ver
# scripts/seed_usuarios.py) - rodar de novo em deploys seguintes não causa erro nem
# duplica usuário.
apiVersion: batch/v1
kind: Job
metadata:
  name: oficina-migrate
  namespace: oficina
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      # o Job só roda uma migration, nunca fala com a API do Kubernetes - não precisa
      # do token de service account que o Kubernetes automonta por padrão.
      automountServiceAccountToken: false
      containers:
        - name: migrate
          # ver o mesmo comentário em deployment.yaml sobre a tag ":local".
          image: ghcr.io/leonardo-abe/fiap_tech_challenge_oficina:local
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "uv run alembic upgrade head && uv run python -m scripts.seed_usuarios"]
          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "512Mi"
