services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-oficina_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-oficina_test}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-oficina_test}
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER:-oficina_test}"]
      interval: 2s
      timeout: 5s
      retries: 10
