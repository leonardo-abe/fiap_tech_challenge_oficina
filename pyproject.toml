[project]
name = "fiap-tech-challenge-oficina"
version = "0.1.0"
description = "Backend MVP do Sistema Integrado de Atendimento e Execução de Serviços de uma oficina mecânica de médio porte."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.51",
    "validate-docbr>=2.0.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "fpdf2>=2.8.7",
    "pip-audit>=2.10.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# migrations/versions são gerados pelo Alembic (autogenerate) - não são código escrito à mão.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query() em argumento default são o padrão idiomático de DI do FastAPI.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# assert é a forma idiomática de asserção do pytest, não um risco de segurança aqui;
# S105/S106 disparam em falso positivo para tokens/hashes/senhas de teste fixos e
# conhecidos, usados de propósito para exercitar código de autenticação/segredo.
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# testes de integração compartilham um engine/conexão asyncpg entre fixture e teste - ambos
# precisam rodar no mesmo event loop, daí o escopo de sessão para os dois.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
